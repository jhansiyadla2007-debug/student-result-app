<html>
<head>

<style>

body {
    font-family: Arial;
    background-color: lightblue;
    text-align: center;
}

.container {
    background-color: white;
    width: 400px;
    margin: 30px auto;
    padding: 25px;
    border-radius: 10px;
}

h2 {
    color: blue;
}

input {
    padding: 8px;
    margin: 5px;
}

button {
    padding: 10px 20px;
    background-color: blue;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: darkblue;
}

#result {
    background-color: lightgreen;
    padding: 15px;
    margin-top: 20px;
    text-align: left;
    border-radius: 8px;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Details</h2>

<label>Name:</label>
<input type="text" id="name">

<br><br>

<label>College:</label>
<input type="text" id="college">

<br><br>

<label>Branch:</label>
<input type="text" id="branch">

<br><br>

<label>Maths:</label>
<input type="number" id="maths">

<br><br>

<label>Java:</label>
<input type="number" id="java">

<br><br>

<label>Python:</label>
<input type="number" id="python">

<br><br>

<button onclick="showDetails()">Show Details</button>

<h3>Student Result</h3>

<p id="result"></p>

</div>

<script>

function showDetails()
{
    let name = document.getElementById("name").value;
    let college = document.getElementById("college").value;
    let branch = document.getElementById("branch").value;

    let maths = Number(document.getElementById("maths").value);
    let java = Number(document.getElementById("java").value);
    let python = Number(document.getElementById("python").value);

    let total = maths + java + python;
    let average = total / 3;

    let result;
    let grade;

    if(maths >= 35 && java >= 35 && python >= 35)
    {
        result = "Pass";
    }
    else
    {
        result = "Fail";
    }

    if(average >= 90)
    {
        grade = "A";
    }
    else if(average >= 75)
    {
        grade = "B";
    }
    else if(average >= 50)
    {
        grade = "C";
    }
    else if(average >= 35)
    {
        grade = "D";
    }
    else
    {
        grade = "Fail";
    }

    document.getElementById("result").innerHTML =
        "<b>Name:</b> " + name +
        "<br><b>College:</b> " + college +
        "<br><b>Branch:</b> " + branch +
        "<br><b>Maths:</b> " + maths +
        "<br><b>Java:</b> " + java +
        "<br><b>Python:</b> " + python +
        "<br><b>Total:</b> " + total +
        "<br><b>Average:</b> " + average +
        "<br><b>Result:</b> " + result +
        "<br><b>Grade:</b> " + grade;
}

</script>

</body>
</html>
